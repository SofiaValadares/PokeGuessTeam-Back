spring.application.name=pokeguessteam

spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.web.locale=pt_BR

spring.datasource.url=jdbc:postgresql://localhost:5432/auth_db
spring.datasource.username=admin
spring.datasource.password=password123
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

server.port=8080
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.timeout=30m

# Socket.io (partidas em tempo real)
app.socketio.host=${SOCKETIO_HOST:0.0.0.0}
app.socketio.port=${SOCKETIO_PORT:9092}

# CORS HTTP (lista separada por vírgula)
app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*,http://192.168.*:*}

# Códigos por e-mail (verificação e recuperação de senha)
app.auth.verification-code-expiry-minutes=15
app.auth.verification-resend-cooldown-seconds=60
app.auth.require-email-verification-for-login=true
app.auth.max-code-verification-attempts=5
app.auth.code-secret=${AUTH_CODE_SECRET:dev-change-me-in-production}

app.mail.from=${APP_MAIL_FROM:PokeTeamGuess <onboarding@resend.dev>}
# Em dev: true = não envia e-mail, só regista o código no log do servidor
app.mail.dev-log-only=${APP_MAIL_DEV_LOG_ONLY:true}
# Em dev: se Resend/SMTP falhar no destino real, reenvia para este e-mail (ignorado com dev-log-only)
app.mail.dev-redirect-to=${APP_MAIL_DEV_REDIRECT_TO:}

# Resend (prioridade sobre SMTP). API: https://resend.com/docs/api-reference/emails/send-email
# Defina RESEND_API_KEY no ficheiro .env na raiz do projeto.
app.resend.api-key=${RESEND_API_KEY:}

# Ferramentas de dev (ajuste de XP, etc.) — desligar em produção
app.dev-tools.enabled=${DEV_TOOLS_ENABLED:true}

