spring.application.name=pokeguessteam

spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.web.locale=pt_BR

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/auth_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password123}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.timeout=30m

# Socket.io (partidas amigo em tempo real)
app.socketio.host=${SOCKETIO_HOST:0.0.0.0}
app.socketio.port=${SOCKETIO_PORT:9092}
# Spring interno (Docker/nginx: 8081; local direto: 8080) — validação de sessão do Socket.io
app.internal-api.base-url=${APP_INTERNAL_API_BASE_URL:http://127.0.0.1:8080}

# CORS HTTP (lista separada por vírgula)
app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*,http://192.168.*:*}

# Códigos por e-mail (verificação e recuperação de senha)
app.auth.verification-code-expiry-minutes=15
app.auth.verification-resend-cooldown-seconds=60
app.auth.require-email-verification-for-login=true
app.auth.max-code-verification-attempts=5
app.auth.code-secret=${AUTH_CODE_SECRET:dev-change-me-in-production}

app.mail.from=${APP_MAIL_FROM:PokeTeamGuess <noreply@sofiavcav.dev>}
app.mail.dev-log-only=${APP_MAIL_DEV_LOG_ONLY:true}
app.mail.dev-redirect-to=${APP_MAIL_DEV_REDIRECT_TO:}

# Resend — defina RESEND_API_KEY no .env (local) ou nas variáveis do host (produção)
app.resend.api-key=${RESEND_API_KEY:}

# Ferramentas de dev — desligar em produção (DEV_TOOLS_ENABLED=false)
app.dev-tools.enabled=${DEV_TOOLS_ENABLED:true}
