spring.application.name=pokeguessteam

spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.web.locale=pt_BR

spring.datasource.url=jdbc:postgresql://localhost:5432/auth_db
spring.datasource.username=admin
spring.datasource.password=password123
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false
server.servlet.session.timeout=30m

# Códigos por e-mail (verificação e recuperação de senha)
app.auth.verification-code-expiry-minutes=15
app.auth.verification-resend-cooldown-seconds=60
app.auth.require-email-verification-for-login=true
app.auth.max-code-verification-attempts=5
app.auth.code-secret=${AUTH_CODE_SECRET:dev-change-me-in-production}

app.mail.from=${APP_MAIL_FROM:PokeTeamGuess <onboarding@resend.dev>}

# Resend (prioridade sobre SMTP). API: https://resend.com/docs/api-reference/emails/send-email
# Defina RESEND_API_KEY no ficheiro .env na raiz do projeto.
app.resend.api-key=${RESEND_API_KEY:}

