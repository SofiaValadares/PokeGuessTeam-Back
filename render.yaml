# Blueprint Render — importe no dashboard ou use "New > Blueprint".
# Ajuste APP_CORS_ALLOWED_ORIGIN_PATTERNS para a URL do frontend (Vercel).

services:
  - type: web
    name: pokeguessteam-api
    runtime: docker
    plan: free
    healthCheckPath: /api/meta
    dockerfilePath: ./Dockerfile
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: AUTH_CODE_SECRET
        generateValue: true
      - key: APP_SECURITY_CRYPTO_KEY
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: REQUIRE_HTTPS
        value: "true"
      - key: HTTPS_REDIRECT_HOST
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: APP_MAIL_FROM
        value: PokeTeamGuess <noreply@sofiavcav.dev>
      - key: APP_MAIL_DEV_LOG_ONLY
        value: "false"
      - key: DEV_TOOLS_ENABLED
        value: "false"
      - key: APP_CORS_ALLOWED_ORIGIN_PATTERNS
        sync: false
      - key: LOG_PATH
        value: /tmp/logs
